name: Label Scan Scorecard (Nightly)

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"

jobs:
  e2e-observe:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LABEL_SCAN_REGRESSION_API_BASE: ${{ github.event.inputs.render_base_url != '' && github.event.inputs.render_base_url || secrets.RENDER_BASE_URL }}
      LABEL_SCAN_REGRESSION_BEARER: ${{ secrets.RENDER_REGRESSION_TOKEN }}
      LABEL_SCAN_REGRESSION_TOKEN: ${{ secrets.RENDER_REGRESSION_TOKEN }}
      LABEL_SCAN_REGRESSION_AUTH_BYPASS: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Preflight required secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "SUPABASE_URL is missing. Configure repository secret SUPABASE_URL."
            exit 1
          fi
          if [ -z "${LABEL_SCAN_REGRESSION_API_BASE:-}" ]; then
            echo "LABEL_SCAN_REGRESSION_API_BASE is empty. Provide workflow input render_base_url or secret RENDER_BASE_URL."
            exit 1
          fi

      - name: Fetch regression set
        run: node scripts/maintainer/fetch-ocr-regression-set.mjs

      - name: Run e2e regression observe
        if: ${{ env.LABEL_SCAN_REGRESSION_API_BASE != '' }}
        run: |
          node scripts/maintainer/ocr-regression-runner.mjs \
            --mode e2e \
            --gate-mode observe \
            --api-base "${LABEL_SCAN_REGRESSION_API_BASE}" \
            --bearer "${LABEL_SCAN_REGRESSION_BEARER}" \
            --regression-token "${LABEL_SCAN_REGRESSION_TOKEN}" \
            --timeout-ms 25000 \
            --concurrency 4 \
            --max-samples 30 \
            --auth-fail-fast 3

      - name: Skip e2e observe (missing API base)
        if: ${{ env.LABEL_SCAN_REGRESSION_API_BASE == '' }}
        run: echo "LABEL_SCAN_REGRESSION_API_BASE is empty; skipping e2e observe run."

      - name: Upload e2e regression artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-scan-e2e-observe-${{ github.run_id }}
          path: output/ocr-regression-run-*/
          if-no-files-found: warn

  scorecard:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [e2e-observe]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LABEL_SCAN_REGRESSION_API_BASE: ${{ github.event.inputs.render_base_url != '' && github.event.inputs.render_base_url || secrets.RENDER_BASE_URL }}
      LABEL_SCAN_REGRESSION_TOKEN: ${{ secrets.RENDER_REGRESSION_TOKEN }}
      LABEL_SCAN_SCORECARD_HOURS: "24"
      LABEL_SCAN_SCORECARD_MAX_ROWS: "5000"
      LABEL_SCAN_SCORECARD_MIN_VARIANT_N: "200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Preflight scorecard secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "SUPABASE_URL is missing. Configure repository secret SUPABASE_URL."
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is missing. Configure repository secret SUPABASE_SERVICE_ROLE_KEY."
            exit 1
          fi
          if [ -z "${LABEL_SCAN_REGRESSION_API_BASE:-}" ]; then
            echo "LABEL_SCAN_REGRESSION_API_BASE is empty. Provide workflow input render_base_url or secret RENDER_BASE_URL."
            exit 1
          fi
          if [ -z "${LABEL_SCAN_REGRESSION_TOKEN:-}" ]; then
            echo "LABEL_SCAN_REGRESSION_TOKEN is missing. Configure repository secret RENDER_REGRESSION_TOKEN."
            exit 1
          fi

      - name: Write scorecard sentinel (ci_smoke)
        run: |
          set -euo pipefail
          resp="$(curl -sS --max-time 10 -w "\n%{http_code}" \
            -X POST "${LABEL_SCAN_REGRESSION_API_BASE%/}/api/label-scan/metrics/smoke" \
            -H "content-type: application/json" \
            -H "x-regression-token: ${LABEL_SCAN_REGRESSION_TOKEN}" \
            --data "{\"runId\":\"${GITHUB_RUN_ID}\"}")"
          body="$(echo "$resp" | sed '$d')"
          status="$(echo "$resp" | tail -n 1)"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Smoke insert failed (http ${status}): ${body}"
            exit 1
          fi

      - name: Run label scan scorecard
        run: node scripts/maintainer/label-scan-scorecard.mjs

      - name: Upload scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-scan-scorecard-${{ github.run_id }}
          path: output/label-scan-scorecard-*/
          if-no-files-found: warn
