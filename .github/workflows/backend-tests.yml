name: Backend Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      reviewed_before_report:
        description: "Baseline reviewed report path (optional)"
        required: false
        type: string
      reviewed_after_report:
        description: "New reviewed report path (optional)"
        required: false
        type: string

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Build Backend
        run: npm --prefix backend run build

      - name: Run Backend Tests
        run: npm --prefix backend test

      - name: Build KB PROV Index
        env:
          KB_PROV_INDEX_PATH: artifacts/kb-integrity/${{ github.run_id }}-${{ github.run_attempt }}/kb_prov_index.json
        run: node scripts/kb/build_kb_prov_index.mjs

      - name: Validate KB PROV Index
        env:
          KB_PROV_INDEX_PATH: artifacts/kb-integrity/${{ github.run_id }}-${{ github.run_attempt }}/kb_prov_index.json
          KB_PROV_VALIDATE_REPORT_PATH: artifacts/kb-integrity/${{ github.run_id }}-${{ github.run_attempt }}/prov_validate_report.json
          KB_PROV_VALIDATE_MODE: fail
        run: node scripts/kb/prov_validate.mjs

      - name: Upload KB PROV Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-prov-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kb-integrity
          if-no-files-found: warn

  quality-system-spec:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Root Dependencies
        run: npm ci --ignore-scripts

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Run Quality System Spec Tests
        run: >
          node --import tsx --test
          tests/scan/science-row-family-hardening.test.ts
          tests/scan/decision-support-allergy-insight.test.ts
          tests/scan/decision-support-algal-source-copy.test.ts
          tests/scan/cross-surface-golden-journey.test.mjs
          tests/validation/runtime-contract-runner.test.mjs
          tests/validation/quality-system-phase-closure.test.mjs
          tests/validation/mobile-scan-smoke-mini.test.mjs
          tests/validation/run-release-quality-system-gates.test.mjs
          tests/search/search-golden-replay-runner.test.mjs
          tests/search/golden-journey-pack-v1.test.mjs
          tests/search/stratified-nightly-pack.test.mjs

  maintainer-e2e-gates:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      API_BASE_URL: http://127.0.0.1:3001
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      ENRICH_STREAM_GATE_OUT_DIR: artifacts/maintainer-e2e/enrich-stream-concurrency-gate
      ENRICH_STREAM_GATE_STREAM_MODE: analysis_bundle_only
      ENRICH_STREAM_GATE_MUST_DONE_BARCODES: 00084783891253
      ENRICH_STREAM_GATE_PARALLEL9_DONE_P95_MAX_MS: "1500"
      ENRICH_STREAM_GATE_PARALLEL9_NOT_FOUND_REV1_P95_MAX_MS: "1700"
      ENRICH_STREAM_MAX_ACTIVE_FULL: "4"
      ENRICH_STREAM_MAX_QUEUE_FULL: "20"
      ENRICH_STREAM_MAX_ACTIVE_BUNDLE_ONLY: "12"
      ENRICH_STREAM_MAX_QUEUE_BUNDLE_ONLY: "50"
      ENRICH_STREAM_QUEUE_WAIT_MS_BUNDLE_ONLY: "1500"
      BULK_E2E_OUT_DIR: artifacts/maintainer-e2e/bulk-barcode-e2e
      BULK_E2E_CA_ZERO_INGREDIENTS_MAX: "1"
      BULK_E2E_ENFORCE_GATES: "1"
      BULK_E2E_UPSERT_MAP: "0"
    steps:
      - name: Check Maintainer Gate Prerequisites
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "schedule" && "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Maintainer E2E gates only run on schedule or workflow_dispatch."
            exit 0
          fi

          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping maintainer E2E gates because required Supabase secrets are missing."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Root Dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci --ignore-scripts

      - name: Install Backend Dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm --prefix backend ci

      - name: Verify DB Contract
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/maintainer/verify-db-contract.mjs

      - name: Build Backend
        if: steps.gate.outputs.enabled == 'true'
        run: npm --prefix backend run build

      - name: Start Backend
        if: steps.gate.outputs.enabled == 'true'
        run: |
          PORT=3001 node backend/dist/server.js > /tmp/backend-e2e.log 2>&1 &
          echo $! > /tmp/backend-e2e.pid
          for i in {1..60}; do
            if curl -sS http://127.0.0.1:3001 >/dev/null 2>&1; then
              echo "backend_up"
              break
            fi
            sleep 2
          done

      - name: Run Stable Backend Gates
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/maintainer/run-backend-gates-stable.mjs --out-dir artifacts/maintainer-e2e
        env:
          RUN_BACKEND_GATES_MANAGE_BACKEND: "0"

      - name: Run Quality System Release Gates
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/maintainer/run-release-quality-system-gates.mjs --api-base-url http://127.0.0.1:3001 --out-dir artifacts/maintainer-e2e/quality-system-release --skip-search-warm-wait

      - name: Generate Reviewed Diff Artifact (Optional)
        if: ${{ always() && steps.gate.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.reviewed_before_report != '' && github.event.inputs.reviewed_after_report != '' }}
        run: |
          node scripts/maintainer/diagnose-reviewed-diff.mjs \
            --before-report "${{ github.event.inputs.reviewed_before_report }}" \
            --after-report "${{ github.event.inputs.reviewed_after_report }}" \
            --out-dir artifacts/reviewed_diff

      - name: Stop Backend
        if: ${{ always() && steps.gate.outputs.enabled == 'true' }}
        run: |
          if [ -f /tmp/backend-e2e.pid ]; then
            kill "$(cat /tmp/backend-e2e.pid)" || true
          fi
          sleep 1

      - name: Upload Maintainer E2E Artifacts
        if: ${{ always() && steps.gate.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/maintainer-e2e
            artifacts/reviewed_diff
          if-no-files-found: warn

      - name: Upload Maintainer E2E Backend Log
        if: ${{ always() && steps.gate.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: maintainer-e2e-backend-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/backend-e2e.log
          if-no-files-found: warn
