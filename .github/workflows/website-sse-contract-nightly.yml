name: Website SSE Contract (Nightly)

on:
  workflow_dispatch:
    inputs:
      render_base_url:
        description: "Optional override for Render base URL"
        required: false
        type: string
      expected_commit_sha:
        description: "Optional override for expected deployed commit SHA"
        required: false
        type: string
  schedule:
    - cron: "25 10 * * *"

concurrency:
  group: website-sse-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website_sse_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Wait for Render Deploy Commit
        env:
          RENDER_BASE_URL: ${{ github.event.inputs.render_base_url != '' && github.event.inputs.render_base_url || secrets.RENDER_BASE_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.event.inputs.expected_commit_sha != '' && github.event.inputs.expected_commit_sha || github.sha }}
          RENDER_REGRESSION_TOKEN: ${{ secrets.RENDER_REGRESSION_TOKEN }}
          RENDER_DEPLOY_WAIT_TIMEOUT_MS: "900000"
          RENDER_DEPLOY_WAIT_INTERVAL_MS: "15000"
          RENDER_DEPLOY_REQUEST_TIMEOUT_MS: "90000"
          RENDER_COMMIT_PROBE_BARCODE: "00029537001069"
        run: node scripts/ci/wait-render-commit.mjs

      - name: Prepare Artifact Directory
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="artifacts/website-sse-contract/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ARTIFACT_DIR"
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Run Website Barcode E2E (Phase1, Suite Both)
        env:
          API_BASE_URL: ${{ github.event.inputs.render_base_url != '' && github.event.inputs.render_base_url || secrets.RENDER_BASE_URL }}
          RENDER_REGRESSION_TOKEN: ${{ secrets.RENDER_REGRESSION_TOKEN }}
          WEB_E2E_OUT_DIR: ${{ steps.artifact.outputs.artifact_dir }}
          WEB_E2E_SSE_TIMEOUT_MS: "50000"
          WEB_E2E_SSE_STOP_ON: "persisted"
          WEB_E2E_SSE_STOP_TAIL_MS: "5000"
          WEB_E2E_RETRIES: "2"
        run: |
          node scripts/maintainer/website-barcode-e2e.mjs \
            --suite both \
            --phase-mode phase1 \
            --sse-stop-on persisted \
            --retries 2

      - name: Assert Gate Summary (Single Source of Truth)
        env:
          ARTIFACT_DIR: ${{ steps.artifact.outputs.artifact_dir }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const gatePath = path.join(process.env.ARTIFACT_DIR, "gate_summary.json");
          const gate = JSON.parse(fs.readFileSync(gatePath, "utf8"));
          const out = {
            phaseMode: gate.phaseMode,
            overall: gate.overall,
            suiteA: gate.suiteA ? { pass: gate.suiteA.pass, failReasons: gate.suiteA.failReasons, warnings: gate.suiteA.warnings } : null,
            suiteB: gate.suiteB ? { pass: gate.suiteB.pass, failReasons: gate.suiteB.failReasons, warnings: gate.suiteB.warnings } : null,
            errorsByType: gate.errors?.byType || {},
          };
          console.log(JSON.stringify(out, null, 2));
          if (!gate?.overall?.pass) {
            throw new Error(`Gate failed: ${(gate?.overall?.failReasons || []).join(", ") || "unknown_reason"}`);
          }
          '

      - name: Upload Artifact
        if: always() && steps.artifact.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: website-sse-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact.outputs.artifact_dir }}
          if-no-files-found: warn
