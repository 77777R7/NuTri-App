name: Goal Navigator Bundle (Nightly)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *" # daily 08:15 UTC

concurrency:
  group: goal-navigator-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild-bundle:
    if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Root Dependencies
        run: npm ci --ignore-scripts

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Rebuild Goal Navigator Bundle
        run: npm run personalization:build-goal-bundle

      - name: Upload Bundle Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goal-navigator-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/data/personalization/goal_navigator_candidate_bundle.v1.json
          if-no-files-found: error

      - name: Commit Updated Bundle
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- backend/data/personalization/goal_navigator_candidate_bundle.v1.json; then
            echo "goal_navigator_bundle_changed=false" >> "$GITHUB_ENV"
            echo "No bundle change detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/personalization/goal_navigator_candidate_bundle.v1.json
          git commit -m "chore(personalization): refresh Goal Navigator bundle"
          git push
          echo "goal_navigator_bundle_changed=true" >> "$GITHUB_ENV"

