name: Render Regression (Nightly)

on:
  workflow_dispatch:
    inputs:
      render_base_url:
        description: "Optional override for Render base URL"
        required: false
        type: string
  schedule:
    - cron: "30 9 * * *" # nightly 09:30 UTC

concurrency:
  group: render-regression-nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Wait for Render Deploy Commit
        env:
          RENDER_BASE_URL: ${{ github.event.inputs.render_base_url != '' && github.event.inputs.render_base_url || secrets.RENDER_BASE_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
          RENDER_REGRESSION_TOKEN: ${{ secrets.RENDER_REGRESSION_TOKEN }}
          RENDER_DEPLOY_WAIT_TIMEOUT_MS: "900000"
          RENDER_DEPLOY_WAIT_INTERVAL_MS: "15000"
          # Render free-tier cold starts can exceed 30s. Avoid false failures in the deploy-wait probe.
          RENDER_DEPLOY_REQUEST_TIMEOUT_MS: "90000"
          RENDER_COMMIT_PROBE_BARCODE: "00029537001069"
        run: node scripts/ci/wait-render-commit.mjs

      - name: Prepare Artifact Directory
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="artifacts/render-regression-nightly/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$ARTIFACT_DIR"
          echo "artifact_dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Run Render Regression Suite (Nightly Extras)
        env:
          RENDER_BASE_URL: ${{ github.event.inputs.render_base_url != '' && github.event.inputs.render_base_url || secrets.RENDER_BASE_URL }}
          RENDER_REGRESSION_TOKEN: ${{ secrets.RENDER_REGRESSION_TOKEN }}
          RENDER_ARTIFACT_DIR: ${{ steps.artifact.outputs.artifact_dir }}
          RENDER_INCLUDE_NIGHTLY_CASES: "1"
          # Nightly-only: enable lexical groundedness checks for early signal without blocking merges.
          RENDER_GROUNDEDNESS_LEXICAL: "1"
          RENDER_GROUNDEDNESS_LEXICAL_REQUIRE_FORM: "0"
          # Optional overrides; script has stable defaults.
          RENDER_DSLD_CREATINE_CITRATE_BARCODE: ${{ vars.RENDER_DSLD_CREATINE_CITRATE_BARCODE }}
        run: node scripts/ci/render-regression.mjs

      - name: Print RAG Metrics Summary (observe-only)
        if: always()
        continue-on-error: true
        env:
          SUMMARY_JSON: ${{ steps.artifact.outputs.artifact_dir }}/summary.json
        run: |
          node - <<'NODE'
          const fs = require("fs");

          try {
            const p = process.env.SUMMARY_JSON;
            if (!p || !fs.existsSync(p)) {
              console.log("[rag-metrics] summary.json not found, skip.");
              process.exit(0);
            }

            const raw = fs.readFileSync(p, "utf8");
            const summary = JSON.parse(raw);
            const rag = summary.ragQuadrantMetrics || {};
            const pipe = summary.ssePipelineMetrics || {};
            const topN = (obj, n = 5) => {
              const entries = Object.entries(obj || {}).sort(
                (a, b) => (b[1] || 0) - (a[1] || 0),
              );
              return entries
                .slice(0, n)
                .map(([k, v]) => `${k}=${v}`)
                .join(", ");
            };

            console.log("[rag] Retrieval");
            console.log(`- retrievalEvidenceHitRate: ${rag.retrievalEvidenceHitRate}`);
            console.log(
              `- retrievalFailureCodeCounts: ${topN(rag.retrievalFailureCodeCounts) || "(none)"}`,
            );

            console.log("[rag] Abstain");
            console.log(`- abstainCorrectnessRate: ${rag.abstainCorrectnessRate}`);
            console.log(
              `- abstainTriggered/evaluated/correct/unknown: ${rag.abstainTriggeredCount}/${rag.abstainEvaluatedCount}/${rag.abstainCorrectCount}/${rag.abstainUnknownCount}`,
            );
            console.log(
              `- abstainUnknownReasonCounts: ${topN(rag.abstainUnknownReasonCounts) || "(none)"}`,
            );
            console.log(`- abstainFallbackHeuristicCount: ${rag.abstainFallbackHeuristicCount}`);

            console.log("[rag] Output");
            console.log(`- webUsefulOutputRate: ${rag.webUsefulOutputRate}`);

            console.log("[pipeline] Timing");
            console.log(`- samplesCount: ${pipe.samplesCount}`);
            console.log(`- totalMsP50/P90: ${pipe.totalMsP50}/${pipe.totalMsP90}`);
            console.log(`- metrics_invalid: ${pipe.metrics_invalid}`);
            const prev = pipe.sortedPreviewMs || {};
            console.log(`- sortedPreviewMs.head: ${(prev.head || []).join(", ")}`);
            console.log(`- sortedPreviewMs.tail: ${(prev.tail || []).join(", ")}`);

            console.log("[rag-metrics] ok");
            process.exit(0);
          } catch (e) {
            console.error(
              "[rag-metrics] best-effort print failed:",
              e?.message || e,
            );
            process.exit(0);
          }
          NODE

      - name: Upload Regression Artifact
        if: always() && steps.artifact.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: render-regression-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact.outputs.artifact_dir }}
          if-no-files-found: warn
