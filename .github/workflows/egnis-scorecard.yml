name: EG-NIS Scorecard

on:
  workflow_dispatch:
    inputs:
      tokens:
        description: "Comma-separated form tokens for coverage checks"
        required: false
        default: "oxide,citrate,glycinate,bisglycinate,ascorbate,picolinate"
        type: string
  schedule:
    - cron: "30 9 * * *" # daily 09:30 UTC (after candidate scan)

concurrency:
  group: egnis-scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Backend Deps
        run: npm --prefix backend ci

      - name: Build Backend (for dist imports)
        run: npm --prefix backend run build

      - name: Validate Supabase Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || ( -z "${SUPABASE_READONLY_KEY:-}" && -z "${SUPABASE_ANON_KEY:-}" ) ]]; then
            echo "Missing SUPABASE_URL and/or SUPABASE_READONLY_KEY (or SUPABASE_ANON_KEY) secrets." >&2
            exit 1
          fi

      - name: Run Candidate Scan (for coverage metrics)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DSLD_FORM_TOKENS: ${{ github.event.inputs.tokens }}
          DSLD_CANDIDATE_ARTIFACT_DIR: artifacts/egnis-scorecard/dsld-form-candidates
          DSLD_SCAN_MAX_EVALUATE: "120"
          DSLD_SCAN_REQUIRE_EXPLICIT: "1"
        run: node scripts/ci/dsld-form-candidate-scan.mjs

      - name: Build Scorecard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCORECARD_ARTIFACT_DIR: artifacts/egnis-scorecard
          DSLD_CANDIDATE_ARTIFACT_DIR: artifacts/egnis-scorecard/dsld-form-candidates
          EGNIS_REQUIRED_RUNS: "10"
          EGNIS_NIGHTLY_RUNS: "14"
          EGNIS_TOKEN_HIT_RATE_THRESHOLD: "0.85"
          EGNIS_FAIL_ON_NOT_READY: "1"
        run: node scripts/ci/egnis-scorecard.mjs

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: egnis-scorecard-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/egnis-scorecard
          if-no-files-found: warn
