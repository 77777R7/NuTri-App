name: DSLD Form Candidate Scan

on:
  workflow_dispatch:
    inputs:
      tokens:
        description: "Comma-separated form tokens to search (e.g. citrate,glycinate,ascorbate)"
        required: false
        default: "oxide,citrate,glycinate,bisglycinate,sulfate,chloride,ascorbate,picolinate"
        type: string
      max_enrich:
        description: "Max label_ids to evaluate (readonly view + local KB matching)"
        required: false
        default: "120"
        type: string
      require_explicit:
        description: "Require (as ...) parenthetical evidence in active_ingredients_summary (1/0)"
        required: false
        default: "1"
        type: string

  schedule:
    - cron: "0 9 * * 1" # weekly Monday 09:00 UTC

concurrency:
  group: dsld-form-candidate-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Backend Deps
        run: npm --prefix backend ci

      - name: Build Backend (for dist imports)
        run: npm --prefix backend run build

      - name: Validate Supabase Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || ( -z "${SUPABASE_READONLY_KEY:-}" && -z "${SUPABASE_ANON_KEY:-}" ) ]]; then
            echo "Missing SUPABASE_URL and/or SUPABASE_READONLY_KEY (or SUPABASE_ANON_KEY) secrets." >&2
            exit 1
          fi

      - name: Run Candidate Scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DSLD_FORM_TOKENS: ${{ github.event.inputs.tokens }}
          DSLD_SCAN_MAX_EVALUATE: ${{ github.event.inputs.max_enrich }}
          DSLD_SCAN_REQUIRE_EXPLICIT: ${{ github.event.inputs.require_explicit }}
        run: node scripts/ci/dsld-form-candidate-scan.mjs

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsld-form-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dsld-form-candidates
          if-no-files-found: warn
