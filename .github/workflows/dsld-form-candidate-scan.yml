name: DSLD Form Candidate Scan

on:
  workflow_dispatch:
    inputs:
      tokens:
        description: "Comma-separated form tokens to search (e.g. citrate,glycinate,ascorbate)"
        required: false
        # Extended list (P1): keep core tokens, plus additional salts/forms that commonly appear
        # in DSLD labels but are not yet guaranteed to have KB coverage. This is meant to surface
        # actionable kb_sentence_missing / kb_excerpt_missing rows for operational iteration.
        default: "oxide,citrate,glycinate,bisglycinate,ascorbate,picolinate,sulfate,chloride,gluconate,carbonate,malate,tartrate,succinate,fumarate,lactate,acetate,phosphate,orotate,bicarbonate,hydrochloride,hcl,monohydrate"
        type: string
      max_enrich:
        description: "Max label_ids to evaluate (readonly view + local KB matching)"
        required: false
        default: "600"
        type: string
      labels_per_token:
        description: "Max meta rows to pull per token (from readonly view)"
        required: false
        default: "800"
        type: string
      max_actives:
        description: "Max actives (approx) per label to include"
        required: false
        default: "30"
        type: string
      output_limit:
        description: "Max output rows per CSV (hits/gaps)"
        required: false
        default: "120"
        type: string
      require_explicit:
        description: "Require (as ...) parenthetical evidence in active_ingredients_summary (1/0)"
        required: false
        default: "1"
        type: string

  schedule:
    - cron: "0 9 * * *" # nightly 09:00 UTC

concurrency:
  group: dsld-form-candidate-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Backend Deps
        run: npm --prefix backend ci

      - name: Build Backend (for dist imports)
        run: npm --prefix backend run build

      - name: Validate Supabase Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL:-}" || ( -z "${SUPABASE_READONLY_KEY:-}" && -z "${SUPABASE_ANON_KEY:-}" ) ]]; then
            echo "Missing SUPABASE_URL and/or SUPABASE_READONLY_KEY (or SUPABASE_ANON_KEY) secrets." >&2
            exit 1
          fi

      - name: Run Candidate Scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_READONLY_KEY: ${{ secrets.SUPABASE_READONLY_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # CI stability: per-token meta queries can occasionally hit PostgREST/db statement timeouts.
          # Use hybrid mode: per-token fetch + sample fallback on failures.
          DSLD_SCAN_META_QUERY_MODE: hybrid
          DSLD_SCAN_META_SAMPLE_SIZE: "8000"
          # For scheduled runs, github.event.inputs.* are empty; provide stable defaults so nightly
          # behaves the same as a workflow_dispatch with default inputs.
          DSLD_FORM_TOKENS: ${{ github.event.inputs.tokens != '' && github.event.inputs.tokens || 'oxide,citrate,glycinate,bisglycinate,ascorbate,picolinate,sulfate,chloride,gluconate,carbonate,malate,tartrate,succinate,fumarate,lactate,acetate,phosphate,orotate,bicarbonate,hydrochloride,hcl,monohydrate' }}
          DSLD_SCAN_MAX_EVALUATE: ${{ github.event.inputs.max_enrich != '' && github.event.inputs.max_enrich || '600' }}
          DSLD_SCAN_MAX_LABELS_PER_TOKEN: ${{ github.event.inputs.labels_per_token != '' && github.event.inputs.labels_per_token || '800' }}
          DSLD_SCAN_MAX_ACTIVES: ${{ github.event.inputs.max_actives != '' && github.event.inputs.max_actives || '30' }}
          DSLD_SCAN_OUTPUT_LIMIT: ${{ github.event.inputs.output_limit != '' && github.event.inputs.output_limit || '120' }}
          DSLD_SCAN_REQUIRE_EXPLICIT: ${{ github.event.inputs.require_explicit != '' && github.event.inputs.require_explicit || '1' }}
        run: node scripts/ci/dsld-form-candidate-scan.mjs

      - name: Build KB Provenance Index (Artifact)
        env:
          KB_PROV_INDEX_PATH: artifacts/dsld-form-candidates/${{ github.run_id }}-${{ github.run_attempt }}/kb_prov_index.json
        run: node scripts/kb/build_kb_prov_index.mjs

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsld-form-candidates-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/dsld-form-candidates
          if-no-files-found: warn
